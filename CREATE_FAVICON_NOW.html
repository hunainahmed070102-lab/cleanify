<!DOCTYPE html>
<html>
<head>
    <title>Create Cleanify Favicon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        canvas {
            border: 2px solid #ccc;
            margin: 20px;
        }
        button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px;
        }
        button:hover {
            background: #15803d;
        }
        .instructions {
            background: #f0f0f0;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Cleanify Favicon Creator</h1>
    <p>Click the button below to download your favicon</p>
    
    <canvas id="canvas" width="32" height="32"></canvas>
    
    <div>
        <button onclick="downloadFavicon()">Download favicon.ico</button>
    </div>
    
    <div class="instructions">
        <h3>After downloading:</h3>
        <ol>
            <li>Save the downloaded file</li>
            <li>Rename it to <strong>favicon.ico</strong></li>
            <li>Move it to: <code>frontend/app/favicon.ico</code></li>
            <li>Restart your dev server</li>
            <li>Hard refresh browser (Cmd+Shift+R)</li>
        </ol>
    </div>

    <script>
        // Draw the favicon
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Green circle background
        ctx.fillStyle = '#16a34a';
        ctx.beginPath();
        ctx.arc(16, 16, 16, 0, Math.PI * 2);
        ctx.fill();
        
        // White "C" text - perfectly centered
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 23px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('C', 16, 16);
        
        function downloadFavicon() {
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'favicon.ico';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                alert('Favicon downloaded!\n\nNow:\n1. Move it to: frontend/app/favicon.ico\n2. Restart dev server\n3. Hard refresh browser');
            }, 'image/png');
        }
    </script>
</body>
</html>
